name: WAVO mobile builds

on:
  push:
    branches: [mobile-app]
    paths:
      - 'mobile/**'
      - '.github/workflows/wavo-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native project folders
        run: flutter create . --org com.wavoworld --project-name wavo_mobile --platforms=android,ios
      - name: Install packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build Android APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wavo-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS compile check
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native project folders
        run: flutter create . --org com.wavoworld --project-name wavo_mobile --platforms=android,ios
      - name: Install packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Compile iOS (unsigned)
        run: flutter build ios --no-codesign
